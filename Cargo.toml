[workspace]
resolver = "3"
members = ["crates/gf_content", "crates/gf_sim", "crates/gf_app", "crates/gf_bench"]
default-members = ["crates/gf_content", "crates/gf_sim", "crates/gf_bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
libm = "0.2"
gf_content = { path = "crates/gf_content" }
gf_sim = { path = "crates/gf_sim" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
